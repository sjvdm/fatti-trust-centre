<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#071d2b">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Fatti Trust Centre home">
          <span class="brand-mark" aria-hidden="true">F</span>
          <span><strong>Fatti</strong><small>Trust Centre</small></span>
        </a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/architecture/' | relative_url }}">Architecture</a>
          <a href="{{ '/security/' | relative_url }}">Security</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/resilience/' | relative_url }}">Resilience</a>
          <a href="{{ '/faq/' | relative_url }}">FAQ</a>
        </nav>
      </div>
    </header>
    <main id="content" class="shell content">
      {{ content }}
    </main>
    <footer>
      <div class="shell footer-inner">
        <p><strong>Fatti Trust Centre</strong><br>Public assurance information for Fatti services.</p>
        <p>Last content review: 13 September 2026<br><a href="{{ '/faq/' | relative_url }}">Scope and limitations</a></p>
      </div>
    </footer>
  </body>
</html>
